version: "3.9"

services:
  livekit:
    image: livekit/livekit-server:v1.5.3
    command:
      - --dev
      - --bind
      - 0.0.0.0
      - --keys
      - "livekit_key: livekit_secret"
      - --udp-port
      - 50000-50200
      - --redis-host
      - redis:6379
    environment:
      LIVEKIT_LOG_LEVEL: info
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50200:50000-50200/udp"
    depends_on:
      - redis

  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_PUBLIC_URL: ws://localhost:7880
      LIVEKIT_API_KEY: livekit_key
      LIVEKIT_API_SECRET: livekit_secret
      DATABASE_URL: sqlite+aiosqlite:///./data/meetflow.db
    volumes:
      - ./data:/app/data
    depends_on:
      - livekit
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "8080:80"


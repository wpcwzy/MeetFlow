<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeetFlow · 会议控制台</title>
    <link rel="stylesheet" href="./styles/main.css">
</head>
<body data-page="dashboard">
    <header class="top-nav">
        <a href="./index.html" class="brand">MeetFlow</a>
        <nav class="nav-links">
            <a href="./index.html" class="nav-link">首页</a>
            <a href="./live.html" class="nav-link">会议</a>
            <a href="./dashboard.html" class="nav-link is-active">管理</a>
        </nav>
        <div class="nav-actions">
            <div id="account-info" class="account-chip hidden">
                <span id="account-email" class="account-chip__email"></span>
                <span id="account-role" class="account-chip__role"></span>
            </div>
            <button id="logout-button" type="button" class="btn btn--ghost nav-logout">退出</button>
        </div>
    </header>

    <main class="page-shell">
        <section class="page-header">
            <div>
                <h1>主持控制台</h1>
                <p>创建会议或查看聊天记录。</p>
            </div>
            <div id="notification" class="toast" role="status" aria-live="assertive"></div>
        </section>

        <section class="content-grid">
            <article class="panel">
                <header class="panel__header">
                    <div>
                        <h2>创建会议</h2>
                    </div>
                </header>
                <form id="create-meeting-form" class="form-stack">
                    <label>
                        会议号
                        <input type="text" name="meeting_number" placeholder="例如：MF-820-992" required>
                    </label>
                    <label>
                        入会口令<span class="helper-optional">可选</span>
                        <input type="text" name="password" placeholder="不需要可留空">
                    </label>
                    <button type="submit" class="btn btn--primary">创建会议</button>
                </form>
            </article>

            <article class="panel chat-history-panel">
                <header class="panel__header">
                    <div>
                        <h2>会议聊天记录</h2>
                    </div>
                </header>
                <form id="view-chat-history-form" class="form-inline">
                    <label>
                        会议号
                        <input type="text" name="meeting_number" placeholder="输入会议号" required>
                    </label>
                    <button type="submit" class="btn btn--ghost">查看记录</button>
                </form>
                <div id="dashboard-chat-messages" class="chat-messages empty" style="height: 400px; margin-top: 1rem; border: 1px solid var(--border); border-radius: 8px;">
                    <!-- Chat messages will be loaded here -->
                    <div class="empty-state" style="display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-muted);">
                        请输入会议号查看聊天记录
                    </div>
                </div>
            </article>
        </section>
    </main>

    <script type="module" src="./scripts/main.js"></script>
</body>
</html>
